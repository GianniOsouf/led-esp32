<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éclairage</title>
<style>
  :root {
    --bg: #12141c;
    --card: #1c1f2b;
    --accent: #ff8a3d;
    --text: #eef0f5;
    --muted: #8890a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 0.95rem; color: var(--muted); margin: 0 0 14px 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mode-btn {
    padding: 14px 10px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #262a3a;
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .mode-btn.active { border-color: var(--accent); background: #33283a; }
  .colors { display: flex; gap: 16px; align-items: center; margin-top: 14px; }
  .color-picker { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .color-picker label { font-size: 0.8rem; color: var(--muted); }
  input[type="color"] { width: 52px; height: 52px; border: none; border-radius: 50%; overflow: hidden; padding: 0; background: none; }
  input[type="range"] { width: 100%; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .days { display: flex; gap: 6px; margin: 12px 0; }
  .day-btn {
    flex: 1; padding: 8px 0; border-radius: 8px; border: none;
    background: #262a3a; color: var(--muted); font-size: 0.75rem; cursor: pointer;
  }
  .day-btn.active { background: var(--accent); color: #12141c; font-weight: 600; }
  input[type="time"], input[type="number"] {
    background: #262a3a; border: none; color: var(--text); padding: 10px; border-radius: 8px; font-size: 1rem;
  }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a3f52; border-radius: 26px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider::before { transform: translateX(20px); }
  #status { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>💡 Éclairage salon</h1>
  <div id="status">Connexion...</div>

  <div class="card">
    <h2>Mode</h2>
    <div class="modes">
      <button class="mode-btn" data-mode="fixed">Fixe</button>
      <button class="mode-btn" data-mode="breathe">Breathe</button>
      <button class="mode-btn" data-mode="fade">Fade</button>
      <button class="mode-btn" data-mode="wave">Wave</button>
    </div>
    <div class="colors">
      <div class="color-picker">
        <input type="color" id="color1" value="#ff7800">
        <label>Couleur 1</label>
      </div>
      <div class="color-picker" id="color2Wrap">
        <input type="color" id="color2" value="#0050ff">
        <label>Couleur 2</label>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Luminosité</h2>
    <input type="range" id="brightness" min="0" max="255" value="255">
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">Mode réveil</h2>
      <label class="switch">
        <input type="checkbox" id="wakeEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <input type="time" id="wakeTime" value="07:00">
      <div>
        <input type="number" id="wakeDuration" min="1" max="60" value="20" style="width:60px"> min
      </div>
    </div>
    <div class="days" id="days"></div>
  </div>

<script>
const dayLabels = ["D", "L", "M", "M", "J", "V", "S"];
const daysEl = document.getElementById("days");
let wakeDays = [false,true,true,true,true,true,false];

dayLabels.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "day-btn";
  b.textContent = l;
  b.onclick = () => { wakeDays[i] = !wakeDays[i]; renderDays(); sendWake(); };
  daysEl.appendChild(b);
});
function renderDays() {
  [...daysEl.children].forEach((b, i) => b.classList.toggle("active", wakeDays[i]));
}
renderDays();

const statusEl = document.getElementById("status");
let ws;
let suppressSend = false; // évite de renvoyer un écho reçu du serveur

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => statusEl.textContent = "Connecté";
  ws.onclose = () => { statusEl.textContent = "Déconnecté, reconnexion..."; setTimeout(connect, 2000); };
  ws.onmessage = (evt) => applyState(JSON.parse(evt.data));
}
connect();

function applyState(s) {
  suppressSend = true;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === s.mode));
  document.getElementById("color1").value = s.color1;
  document.getElementById("color2").value = s.color2;
  document.getElementById("brightness").value = s.brightness;
  document.getElementById("wakeEnabled").checked = s.wakeEnabled;
  document.getElementById("wakeTime").value =
    String(s.wakeHour).padStart(2,"0") + ":" + String(s.wakeMinute).padStart(2,"0");
  document.getElementById("wakeDuration").value = Math.round(s.wakeDuration / 60);
  wakeDays = s.wakeDays;
  renderDays();
  suppressSend = false;
}

function send(obj) {
  if (suppressSend) return;
  ws.readyState === 1 && ws.send(JSON.stringify(obj));
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    sendMode();
  };
});
function sendMode() {
  const active = document.querySelector(".mode-btn.active");
  send({
    cmd: "setMode",
    mode: active ? active.dataset.mode : "fixed",
    color1: document.getElementById("color1").value,
    color2: document.getElementById("color2").value
  });
}
document.getElementById("color1").addEventListener("input", sendMode);
document.getElementById("color2").addEventListener("input", sendMode);

document.getElementById("brightness").addEventListener("input", (e) => {
  send({ cmd: "setBrightness", value: parseInt(e.target.value) });
});

function sendWake() {
  const [h, m] = document.getElementById("wakeTime").value.split(":").map(Number);
  send({
    cmd: "setWake",
    enabled: document.getElementById("wakeEnabled").checked,
    hour: h, minute: m,
    duration: parseInt(document.getElementById("wakeDuration").value) * 60,
    days: wakeDays
  });
}
document.getElementById("wakeEnabled").addEventListener("change", sendWake);
document.getElementById("wakeTime").addEventListener("change", sendWake);
document.getElementById("wakeDuration").addEventListener("change", sendWake);
</script>
</body>
</html>
