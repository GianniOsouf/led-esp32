<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éclairage</title>
<style>
  :root {
    --bg: #05070d;
    --bg-grid: rgba(0, 240, 255, 0.035);
    --card: #0d1320;
    --card-border: rgba(0, 240, 255, 0.18);
    --accent: #00f0ff;
    --accent-soft: rgba(0, 240, 255, 0.35);
    --accent2: #ff2ee6;
    --accent2-soft: rgba(255, 46, 230, 0.35);
    --text: #eaf6ff;
    --muted: #61798e;
    --danger: #ff4d6d;
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: var(--font);
    background:
      radial-gradient(circle at 15% 0%, rgba(0, 240, 255, 0.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255, 46, 230, 0.07), transparent 45%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    padding: 24px 18px 60px;
    max-width: 480px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 4px 0;
    text-shadow: 0 0 10px var(--accent-soft), 0 0 26px rgba(0, 240, 255, 0.25);
  }

  #status {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 22px;
    letter-spacing: 0.03em;
  }

  /* --- Cartes --- */
  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)), var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.3),
      0 12px 28px rgba(0, 0, 0, 0.35),
      0 0 22px rgba(0, 240, 255, 0.04) inset;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(0, 240, 255, 0.05) 50%, transparent 60%);
    pointer-events: none;
  }

  .card h2 {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    margin: 0 0 16px 0;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* --- Modes --- */
  .modes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .mode-btn {
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #121a2c;
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .mode-btn:hover {
    border-color: var(--accent-soft);
    transform: translateY(-1px);
  }

  .mode-btn.active {
    border-color: var(--accent);
    background: linear-gradient(160deg, rgba(0, 240, 255, 0.14), rgba(255, 46, 230, 0.08));
    color: #ffffff;
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), 0 0 0 1px var(--accent);
  }

  /* --- Couleurs --- */
  .colors {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-top: 18px;
    justify-content: center;
  }

  .color-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .color-picker label {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  input[type="color"] {
    width: 54px;
    height: 54px;
    border: none;
    border-radius: 50%;
    overflow: hidden;
    padding: 0;
    background: none;
    cursor: pointer;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08), 0 0 16px rgba(0, 240, 255, 0.25);
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

  /* --- Range (luminosité) --- */
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    outline: none;
    margin: 6px 0 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(0, 240, 255, 0.5);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(0, 240, 255, 0.5);
    cursor: pointer;
  }

  /* --- Layout générique --- */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  /* --- Jours de la semaine --- */
  .days {
    display: flex;
    gap: 6px;
    margin: 14px 0 4px;
  }

  .day-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: #121a2c;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .day-btn.active {
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    color: #05070d;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
  }

  /* --- Champs heure / nombre --- */
  input[type="time"],
  input[type="number"] {
    background: #121a2c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: var(--font);
  }
  input[type="time"]:focus,
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
  }

  /* --- Switch on/off --- */
  .switch {
    position: relative;
    width: 48px;
    height: 27px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #1c2436;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 27px;
    cursor: pointer;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 19px;
    height: 19px;
    left: 3px;
    top: 3px;
    background: #ffffff;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    border-color: transparent;
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
  }
  input:checked + .slider::before {
    transform: translateX(21px);
  }
</style>
</head>
<body>
  <h1>💡 Éclairage chambre</h1>
  <div id="status">Connexion...</div>
  
  <div class="card">
    <div class="row">
      <h2 style="margin:0">Allumage</h2>
      <label class="switch">
        <input type="checkbox" id="power">
        <span class="slider"></span>
      </label>
    </div> 
  </div>

  <div class="card">
    <h2>Mode</h2>
    <div class="modes">
      <button class="mode-btn" data-mode="fixed">Fixe</button>
      <button class="mode-btn" data-mode="breathe">Breathe</button>
      <button class="mode-btn" data-mode="fade">Fade</button>
      <button class="mode-btn" data-mode="wave">Wave</button>
      <button class="mode-btn" data-mode="strobe">Strobe</button>
      <button class="mode-btn" data-mode="candle">Bougie</button>
      <button class="mode-btn" data-mode="alternate">Alternance</button>
    </div>
    <div class="colors">
      <div class="color-picker">
        <input type="color" id="color1" value="#ff7800">
        <label>Couleur 1</label>
      </div>
      <div class="color-picker" id="color2Wrap">
        <input type="color" id="color2" value="#0050ff">
        <label>Couleur 2</label>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Luminosité</h2>
    <input type="range" id="brightness" min="0" max="255" value="255">
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">Mode réveil</h2>
      <label class="switch">
        <input type="checkbox" id="wakeEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <input type="time" id="wakeTime" value="07:00">
      <div>
        <input type="number" id="wakeDuration" min="1" max="60" value="20" style="width:60px"> min
      </div>
    </div>
    <div class="days" id="days"></div>
    <div class="row" style="margin-top: 12px">
      <span style="font-size: 0.85rem;color:var(--muted)">Flash après réveil</span>
      <label class="switch">
        <input type="checkbox" id="flashAfter">
        <span class="slider"></span>
      </label>
    </div>
  </div>

<script>
const dayLabels = ["D", "L", "M", "M", "J", "V", "S"];
const daysEl = document.getElementById("days");
let wakeDays = [false,true,true,true,true,true,false];

dayLabels.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "day-btn";
  b.textContent = l;
  b.onclick = () => { wakeDays[i] = !wakeDays[i]; renderDays(); sendWake(); };
  daysEl.appendChild(b);
});
function renderDays() {
  [...daysEl.children].forEach((b, i) => b.classList.toggle("active", wakeDays[i]));
}
renderDays();

const statusEl = document.getElementById("status");
let ws;
let suppressSend = false; // évite de renvoyer un écho reçu du serveur

function connect() {
  const wsProtocol =
    window.location.protocol === "https:" ? "wss:" : "ws:";

  const wsUrl = `${wsProtocol}//${window.location.host}/ws`;

  console.log("Connexion WebSocket :", wsUrl);

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    console.log("WebSocket ouvert");
    statusEl.textContent = "Connecté";
  };

  ws.onerror = (e) => {
    console.error("Erreur WebSocket", e);
  };

  ws.onclose = () => {
    console.log("WebSocket fermé");
    statusEl.textContent = "Déconnecté, reconnexion...";
    setTimeout(connect, 2000);
  };

  ws.onmessage = (evt) => {
    applyState(JSON.parse(evt.data));
  };
}
connect();

function applyState(s) {
  suppressSend = true;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === s.mode));
  document.getElementById("color1").value = s.color1;
  document.getElementById("color2").value = s.color2;
  document.getElementById("brightness").value = s.brightness;
  document.getElementById("wakeEnabled").checked = s.wakeEnabled;
  document.getElementById("wakeTime").value =
    String(s.wakeHour).padStart(2,"0") + ":" + String(s.wakeMinute).padStart(2,"0");
  document.getElementById("wakeDuration").value = Math.round(s.wakeDuration / 60);
  document.getElementById("power").checked = s.powerOn;
  document.getElementById("flashAfter").checked = s.wakeFlashAfter;
  wakeDays = s.wakeDays;
  renderDays();
  suppressSend = false;
}

function send(obj) {
  if (suppressSend) return;
  ws.readyState === 1 && ws.send(JSON.stringify(obj));
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    sendMode();
  };
});
function sendMode() {
  const active = document.querySelector(".mode-btn.active");
  send({
    cmd: "setMode",
    mode: active ? active.dataset.mode : "fixed",
    color1: document.getElementById("color1").value,
    color2: document.getElementById("color2").value
  });
}
document.getElementById("color1").addEventListener("input", sendMode);
document.getElementById("color2").addEventListener("input", sendMode);

document.getElementById("brightness").addEventListener("input", (e) => {
  send({ cmd: "setBrightness", value: parseInt(e.target.value) });
});

document.getElementById("power").addEventListener("change", (e) => {
  send({ cmd: "setPower", value: e.target.checked });
});
document.getElementById("flashAfter").addEventListener("change", sendWake);

function sendWake() {
  const [h, m] = document.getElementById("wakeTime").value.split(":").map(Number);
  send({
    cmd: "setWake",
    enabled: document.getElementById("wakeEnabled").checked,
    hour: h, minute: m,
    duration: parseInt(document.getElementById("wakeDuration").value) * 60,
    flashAfter: document.getElementById("wakeFlashAfter").checked,
    days: wakeDays
  });
}
document.getElementById("wakeEnabled").addEventListener("change", sendWake);
document.getElementById("wakeTime").addEventListener("change", sendWake);
document.getElementById("wakeDuration").addEventListener("change", sendWake);
</script>
</body>
</html>
