<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Éclairage</title>
<style>
  :root {
    --bg: #05070d;
    --card: #0d1320;
    --card-border: rgba(0, 240, 255, 0.18);
    --accent: #00f0ff;
    --accent2: #ff2ee6;
    --accent-soft: rgba(0, 240, 255, 0.35);
    --accent-faint: rgba(0, 240, 255, 0.08);
    --accent-strong: rgba(0, 240, 255, 0.5);
    --accent2-tint: rgba(255, 46, 230, 0.08);
    --text: #eaf6ff;
    --muted: #61798e;
    --radius: 16px;
    --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    transition: box-shadow 0.35s ease, text-shadow 0.35s ease,
                border-color 0.35s ease, background 0.35s ease,
                transform 0.18s ease, filter 0.5s ease;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: var(--font);
    background:
      radial-gradient(circle at 15% 0%, var(--accent-faint), transparent 45%),
      radial-gradient(circle at 85% 100%, var(--accent2-tint), transparent 45%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    padding: 24px 18px 60px;
    max-width: 480px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  body.power-off {
    filter: grayscale(0.85) brightness(0.7);
  }

  h1 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0 0 4px 0;
    text-shadow: 0 0 10px var(--accent-soft), 0 0 26px var(--accent-soft);
  }

  #status {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 22px;
    letter-spacing: 0.03em;
  }

  /* --- Cartes --- */
  .card {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0)), var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow:
      0 0 0 1px rgba(0, 0, 0, 0.3),
      0 12px 28px rgba(0, 0, 0, 0.35),
      0 0 22px var(--accent-faint) inset;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(0, 240, 255, 0.05) 50%, transparent 60%);
    pointer-events: none;
  }

  .card h2 {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    margin: 0 0 16px 0;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  /* --- Modes --- */
  .modes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .mode-btn {
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #121a2c;
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
  }

  .mode-btn:hover {
    border-color: var(--accent-soft);
    transform: translateY(-1px) scale(1.05);
  }

  .mode-btn.active {
    border-color: var(--accent);
    background: linear-gradient(160deg, rgba(0, 240, 255, 0.14), rgba(255, 46, 230, 0.08));
    color: #ffffff;
    box-shadow: 0 0 16px var(--accent-soft), 0 0 0 1px var(--accent);
  }

  /* --- Couleurs --- */
  .colors {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-top: 18px;
    justify-content: center;
  }

  .color-picker {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .color-picker label {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .swatch {
    width: 54px; height: 54px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
    background: var(--sw-color);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 0 16px var(--accent-soft);
  }
  .swatch:hover { transform: scale(1.1); }

  /* --- Range (luminosité) --- */
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    outline: none;
    margin: 6px 0 2px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-strong);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent-strong);
    cursor: pointer;
  }

  /* --- Layout générique --- */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  /* --- Jours de la semaine --- */
  .days {
    display: flex;
    gap: 6px;
    margin: 14px 0 4px;
  }

  .day-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: #121a2c;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  .day-btn:hover {
    transform: scale(1.1);
    border-color: var(--accent-soft);
  }

  .day-btn.active {
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    color: #05070d;
    border-color: transparent;
    box-shadow: 0 0 12px var(--accent-strong);
  }

  /* --- Champs heure / nombre --- */
  input[type="number"] {
    background: #121a2c;
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: var(--font);
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-soft);
  }

  .time-select { display: flex; align-items: center; gap: 6px; }
  .time-select select {
    background: #121a2c; border: 1px solid rgba(255,255,255,0.08); color: var(--text);
    padding: 11px 10px; border-radius: 10px; font-size: 0.95rem; font-family: var(--font);
    appearance: none; -webkit-appearance: none; cursor: pointer;
  }
  .time-select select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px var(--accent-soft); }
  .time-select select:hover { transform: scale(1.06); }
  .time-sep { color: var(--muted); font-weight: 700; }

  /* --- Switch on/off --- */
  .switch {
    position: relative;
    width: 48px;
    height: 27px;
    flex-shrink: 0;
  }
  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    inset: 0;
    background: #1c2436;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 27px;
    cursor: pointer;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 19px;
    height: 19px;
    left: 3px;
    top: 3px;
    background: #ffffff;
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .slider {
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    border-color: transparent;
    box-shadow: 0 0 14px var(--accent-strong);
  }
  input:checked + .slider::before {
    transform: translateX(21px);
  }

  /* --- Dialogue de sélection de couleur --- */
  .color-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(2,4,10,0.72);
    align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .color-overlay.open { display: flex; }
  .color-dialog {
    background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
    padding: 22px; width: 100%; max-width: 320px;
    box-shadow: 0 0 30px var(--accent-soft), 0 20px 50px rgba(0,0,0,0.5);
  }
  .color-dialog h2 {
    font-size: 0.85rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 16px 0; text-align: center;
  }
  .fav-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
  .fav-swatch {
    width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.12);
    background: var(--sw-color); cursor: pointer; padding: 0;
  }
  .fav-swatch:hover { transform: scale(1.15); box-shadow: 0 0 14px var(--sw-color); }
  .color-dialog-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .mem-btn {
    padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer;
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    color: #05070d; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.02em;
  }
  .close-btn {
    display: block; width: 100%; padding: 10px; border-radius: 10px; cursor: pointer;
    background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--muted);
    font-size: 0.82rem; font-weight: 600;
  }
  .close-btn:hover { border-color: var(--accent-soft); color: var(--text); }
  .mem-btn:hover, .close-btn:hover, input[type="color"]:hover, .time-select select:hover {
    transform: scale(1.06);
  }
  input[type="color"] {
    width: 54px; height: 54px; border: none; border-radius: 50%; overflow: hidden; padding: 0;
    background: none; cursor: pointer;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 0 16px var(--accent-soft);
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
</style>
</head>
<body>
  <h1>💡 Éclairage chambre</h1>
  <div id="status">Connexion...</div>

  <div class="card">
    <div class="row" style="margin:0">
      <h2 style="margin:0">Allumage</h2>
      <label class="switch">
        <input type="checkbox" id="power">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <h2>Mode</h2>
    <div class="modes">
      <button class="mode-btn" data-mode="fixed">Fixe</button>
      <button class="mode-btn" data-mode="breathe">Breathe</button>
      <button class="mode-btn" data-mode="fade">Fade</button>
      <button class="mode-btn" data-mode="wave">Wave</button>
      <button class="mode-btn" data-mode="strobe">Strobe</button>
      <button class="mode-btn" data-mode="candle">Bougie</button>
      <button class="mode-btn" data-mode="alternate">Alternance</button>
    </div>
    <div class="colors">
      <div class="color-picker">
        <button type="button" class="swatch" id="swatch_color1" style="--sw-color:#ff7800"></button>
        <label>Couleur 1</label>
      </div>
      <div class="color-picker" id="color2Wrap">
        <button type="button" class="swatch" id="swatch_color2" style="--sw-color:#0050ff"></button>
        <label>Couleur 2</label>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Luminosité</h2>
    <input type="range" id="brightness" min="0" max="255" value="255">
  </div>

  <div class="card">
    <div class="row">
      <h2 style="margin:0">Mode réveil</h2>
      <label class="switch">
        <input type="checkbox" id="wakeEnabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <div class="time-select">
        <select id="wakeHour"></select>
        <span class="time-sep">:</span>
        <select id="wakeMinute"></select>
      </div>
      <div>
        <input type="number" id="wakeDuration" min="1" max="60" value="20" style="width:60px"> min
      </div>
    </div>
    <div class="days" id="days"></div>
    <div class="row" style="margin-top: 12px">
      <span style="font-size: 0.85rem;color:var(--muted)">Flash après réveil</span>
      <label class="switch">
        <input type="checkbox" id="flashAfter">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="color-overlay" id="colorOverlay">
    <div class="color-dialog">
      <h2>Choisir une couleur</h2>
      <div class="fav-row" id="favRow"></div>
      <div class="color-dialog-row">
        <input type="color" id="nativeColor" value="#ff7800">
        <button type="button" class="mem-btn" id="memBtn">Mémoriser</button>
      </div>
      <button type="button" class="close-btn" id="closeColorDialog">Fermer</button>
    </div>
  </div>

<script>
const dayLabels = ["D", "L", "M", "M", "J", "V", "S"];
const daysEl = document.getElementById("days");
let wakeDays = [false,true,true,true,true,true,false];
let favorites = ["#ff0000","#00ff00","#0000ff","#ffff00","#ffffff"];
let editingTarget = null;
let currentColors = { color1: "#ff7800", color2: "#0050ff" };

dayLabels.forEach((l, i) => {
  const b = document.createElement("button");
  b.className = "day-btn";
  b.textContent = l;
  b.onclick = () => { wakeDays[i] = !wakeDays[i]; renderDays(); sendWake(); };
  daysEl.appendChild(b);
});
function renderDays() {
  [...daysEl.children].forEach((b, i) => b.classList.toggle("active", wakeDays[i]));
}
renderDays();

// --- Sélecteurs heure réveil ---
const hourSel = document.getElementById("wakeHour");
const minSel = document.getElementById("wakeMinute");
for (let h = 0; h < 24; h++) {
  const o = document.createElement("option");
  o.value = o.textContent = String(h).padStart(2, "0");
  hourSel.appendChild(o);
}
for (let m = 0; m < 60; m++) {
  const o = document.createElement("option");
  o.value = o.textContent = String(m).padStart(2, "0");
  minSel.appendChild(o);
}

// --- Dialogue couleur ---
const colorOverlay = document.getElementById("colorOverlay");
const favRow = document.getElementById("favRow");
const nativeColor = document.getElementById("nativeColor");

function setSwatch(target, hex) {
  currentColors[target] = hex;
  document.getElementById("swatch_" + target).style.setProperty("--sw-color", hex);
}

function renderFavorites() {
  favRow.innerHTML = "";
  favorites.forEach(hex => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "fav-swatch";
    b.style.setProperty("--sw-color", hex);
    b.onclick = () => {
      setSwatch(editingTarget, hex);
      sendMode();
      closeColorDialog();
    };
    favRow.appendChild(b);
  });
}
renderFavorites();

function openColorDialog(target) {
  editingTarget = target;
  nativeColor.value = currentColors[target];
  colorOverlay.classList.add("open");
}
function closeColorDialog() {
  colorOverlay.classList.remove("open");
  editingTarget = null;
}

document.getElementById("swatch_color1").addEventListener("click", () => openColorDialog("color1"));
document.getElementById("swatch_color2").addEventListener("click", () => openColorDialog("color2"));
document.getElementById("closeColorDialog").addEventListener("click", closeColorDialog);
colorOverlay.addEventListener("click", (e) => { if (e.target === colorOverlay) closeColorDialog(); });

nativeColor.addEventListener("input", () => {
  if (!editingTarget) return;
  setSwatch(editingTarget, nativeColor.value);
  sendMode();
});

document.getElementById("memBtn").addEventListener("click", () => {
  if (!editingTarget) return;
  send({ cmd: "saveFavorite", color: currentColors[editingTarget] });
});

// --- Néon dynamique ---
function hexToRgb(hex) {
  const v = hex.replace('#', '');
  return { r: parseInt(v.substr(0, 2), 16), g: parseInt(v.substr(2, 2), 16), b: parseInt(v.substr(4, 2), 16) };
}
function updateNeonColors(c1, c2) {
  const root = document.documentElement.style;
  const rgb1 = hexToRgb(c1), rgb2 = hexToRgb(c2);
  root.setProperty('--accent', c1);
  root.setProperty('--accent2', c2);
  root.setProperty('--accent-soft', `rgba(${rgb1.r},${rgb1.g},${rgb1.b},0.35)`);
  root.setProperty('--accent-faint', `rgba(${rgb1.r},${rgb1.g},${rgb1.b},0.08)`);
  root.setProperty('--accent-strong', `rgba(${rgb1.r},${rgb1.g},${rgb1.b},0.5)`);
  root.setProperty('--accent2-tint', `rgba(${rgb2.r},${rgb2.g},${rgb2.b},0.08)`);
}

// --- Websocket ---
const statusEl = document.getElementById("status");
let ws;
let suppressSend = false;

function connect() {
  const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { statusEl.textContent = "Connecté"; };
  ws.onerror = (e) => console.error("Erreur WebSocket", e);
  ws.onclose = () => { statusEl.textContent = "Déconnecté, reconnexion..."; setTimeout(connect, 2000); };
  ws.onmessage = (evt) => applyState(JSON.parse(evt.data));
}
connect();

function applyState(s) {
  suppressSend = true;
  document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === s.mode));
  setSwatch("color1", s.color1);
  setSwatch("color2", s.color2);
  updateNeonColors(s.color1, s.color2);
  document.body.classList.toggle("power-off", !s.powerOn);
  document.getElementById("brightness").value = s.brightness;
  document.getElementById("power").checked = s.powerOn;
  document.getElementById("wakeEnabled").checked = s.wakeEnabled;
  hourSel.value = String(s.wakeHour).padStart(2, "0");
  minSel.value = String(s.wakeMinute).padStart(2, "0");
  document.getElementById("wakeDuration").value = Math.round(s.wakeDuration / 60);
  document.getElementById("flashAfter").checked = s.wakeFlashAfter;
  wakeDays = s.wakeDays;
  renderDays();
  if (Array.isArray(s.favorites) && s.favorites.length) {
    favorites = s.favorites;
    renderFavorites();
  }
  suppressSend = false;
}

function send(obj) {
  if (suppressSend) return;
  ws.readyState === 1 && ws.send(JSON.stringify(obj));
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".mode-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    sendMode();
  };
});
function sendMode() {
  const active = document.querySelector(".mode-btn.active");
  send({
    cmd: "setMode",
    mode: active ? active.dataset.mode : "fixed",
    color1: currentColors.color1,
    color2: currentColors.color2
  });
}

document.getElementById("brightness").addEventListener("input", (e) => {
  send({ cmd: "setBrightness", value: parseInt(e.target.value) });
});

document.getElementById("power").addEventListener("change", (e) => {
  send({ cmd: "setPower", value: e.target.checked });
});
document.getElementById("flashAfter").addEventListener("change", sendWake);

function sendWake() {
  send({
    cmd: "setWake",
    enabled: document.getElementById("wakeEnabled").checked,
    hour: parseInt(hourSel.value),
    minute: parseInt(minSel.value),
    duration: parseInt(document.getElementById("wakeDuration").value) * 60,
    flashAfter: document.getElementById("flashAfter").checked,
    days: wakeDays
  });
}
document.getElementById("wakeEnabled").addEventListener("change", sendWake);
hourSel.addEventListener("change", sendWake);
minSel.addEventListener("change", sendWake);
document.getElementById("wakeDuration").addEventListener("change", sendWake);
</script>
</body>
</html>
