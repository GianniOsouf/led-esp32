<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration wifi</title>
<style>
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #12141c; color: #eef0f5; padding: 24px; max-width: 420px; margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin-bottom: 6px; }
  p { color: #8890a3; font-size: 0.9rem; margin-top: 0; }
  .card { background: #1c1f2b; border-radius: 16px; padding: 20px; margin-top: 20px; }
  label { display: block; font-size: 0.85rem; color: #8890a3; margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #262a3a; color: #eef0f5; font-size: 1rem;
  }
  button {
    width: 100%; margin-top: 22px; padding: 14px; border-radius: 10px; border: none;
    background: #ff8a3d; color: #12141c; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>💡 Configuration wifi</h1>
  <p>Renseigne le réseau de ta box pour que l'éclairage puisse s'y connecter.</p>
  <div class="card">
    <form action="/wifi-config" method="POST">
      <label for="ssid">Nom du réseau (SSID)</label>
      <input type="text" id="ssid" name="ssid" required autocomplete="off">
      <label for="pass">Mot de passe</label>
      <input type="password" id="pass" name="pass" autocomplete="off">
      <button type="submit">Connecter</button>
    </form>
  </div>
</body>
</html>
